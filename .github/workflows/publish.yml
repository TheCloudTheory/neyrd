name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for Nerdbank.GitVersioning

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install nbgv
        run: dotnet tool install --global nbgv

      - name: Get version
        id: version
        run: echo "version=$(nbgv get-version -v NuGetPackageVersion)" >> "$GITHUB_OUTPUT"

      - name: Publish emitter (Linux x64, AOT)
        run: >
          dotnet publish neyrd.emitter/neyrd.emitter.csproj
          -c Release
          -r linux-x64
          --self-contained
          -o publish/linux-x64

      - name: Publish receiver (Linux x64, single-file)
        run: >
          dotnet publish neyrd.receiver/neyrd.receiver.csproj
          -c Release
          -r linux-x64
          --self-contained
          -p:PublishSingleFile=true
          -o publish/receiver-linux-x64

      - name: Publish receiver (macOS ARM64, self-contained)
        run: >
          dotnet publish neyrd.receiver/neyrd.receiver.csproj
          -c Release
          -r osx-arm64
          --self-contained
          -p:PublishSingleFile=true
          -o publish/receiver-osx-arm64

      - name: Rename receiver artifacts
        run: |
          mv publish/receiver-linux-x64/neyrd.receiver publish/receiver-linux-x64/neyrd.receiver-linux-x64
          mv publish/receiver-osx-arm64/neyrd.receiver publish/receiver-osx-arm64/neyrd.receiver-osx-arm64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            publish/linux-x64/neyrd.emitter
            publish/receiver-linux-x64/neyrd.receiver-linux-x64
            publish/receiver-osx-arm64/neyrd.receiver-osx-arm64
